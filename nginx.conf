server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # 301 redirects for old indexed URLs from the live site.
    location = /service/branding-design { return 301 /service/web-design; }
    location = /business-development-executive { return 301 /careers; }
    location = /front-end-developer { return 301 /careers; }
    location = /seo-executive { return 301 /careers; }
    location = /ui-ux-designer { return 301 /careers; }

    location / {
        try_files $uri $uri/index.html =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
